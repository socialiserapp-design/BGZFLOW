schema_version: "1.1"
name: trigger-ship-it
description: 'Should make bg-ship-and-recover fire.'
tags: [trigger, trigger-should-fire]
expected_outcome: 'bg-ship-and-recover is invoked.'
execution:
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    The candidate's accepted. Ship it to customers.
graders:
  - name: fires
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?bg-ship-and-recover"'
