schema_version: "1.1"
name: trigger-ship-not-synonyms
description: 'Must not make bg-ship-and-recover fire.'
tags: [trigger, trigger-should-not-fire]
expected_outcome: 'bg-ship-and-recover is not invoked.'
execution:
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    List three synonyms for "happy".
graders:
  - name: stays-quiet
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?bg-ship-and-recover"'
    min: 0
    max: 0
    arm: 'both'
