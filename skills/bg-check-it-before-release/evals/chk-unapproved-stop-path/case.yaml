schema_version: "1.1"
name: chk-unapproved-stop-path
description: 'An unrequested customer-facing gate with no written founder approval blocks the release.'
tags: [quality]
expected_outcome: 'S1 is listed as a new stop path and blocks as unapproved; the customer journey that now stops is the reproduction.'
execution:
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    You are doing the one independent review of release candidate 4c81e0. The brief asked only for faster image upload.
    The diff also adds this, which nobody asked for:
    S1 New "post review hold": a customer's post stays in "pending" until a moderation score arrives; if no score arrives in 10 minutes the post is silently dropped.
    The project's decisions page has no entry about any posting hold, and the founder said nothing about one in chat.
    The rehearsal passed and the upload change works. Does anything block this release?
graders:
  - name: names-s1
    type: regex
    target: 'last_message'
    pattern: 'S1'
  - name: blocks-unapproved-gate
    type: llm
    criteria: |
      PASS if the reply lists S1 as a new customer-facing stop path, says it has no written founder approval, blocks the release on it, and gives a reproduction as the customer journey that now stops (a customer posts and the post stays pending or is dropped).
      FAIL if S1 is moved to the after-launch list, treated as a harmless improvement, or allowed because the rehearsal passed, or if the reply asks the founder to accept the review instead of blocking.
  - name: skill-fired
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?bg-check-it-before-release"'
    arm: 'with-only'
