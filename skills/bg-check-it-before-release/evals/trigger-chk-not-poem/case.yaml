schema_version: "1.1"
name: trigger-chk-not-poem
description: 'Must not make bg-check-it-before-release fire.'
tags: [trigger, trigger-should-not-fire]
expected_outcome: 'bg-check-it-before-release is not invoked.'
execution:
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Write a haiku about autumn.
graders:
  - name: stays-quiet
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?bg-check-it-before-release"'
    min: 0
    max: 0
    arm: 'both'
