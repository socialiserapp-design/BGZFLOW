schema_version: "1.1"
name: eff-large-log-search
description: 'A large log is searched, not read whole, and the buried error is found.'
tags: [efficiency]
expected_outcome: 'Grep used; no whole-file Read of the log; reply names E4471.'
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    CI failed overnight. The full log is logs/ci-run.log in this folder. What broke?
graders:
  - name: searched
    type: tool_used
    tool: 'Grep'
    min: 1
  - name: no-whole-read
    type: tool_used
    tool: 'Read'
    input_match: '^(?!.*"(?:limit|offset)").*ci-run\.log'
    min: 0
    max: 0
    arm: 'both'
  - name: found-error
    type: regex
    target: 'last_message'
    pattern: 'E4471'
  - name: skill-fired
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?bg-efficiency"'
    arm: 'with-only'
