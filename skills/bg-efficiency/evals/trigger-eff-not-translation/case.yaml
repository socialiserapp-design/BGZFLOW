schema_version: "1.1"
name: trigger-eff-not-translation
description: 'Must not make bg-efficiency fire.'
tags: [trigger, trigger-should-not-fire]
expected_outcome: 'bg-efficiency is not invoked.'
execution:
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Translate into French: "The meeting moved to Thursday."
graders:
  - name: stays-quiet
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?bg-efficiency"'
    min: 0
    max: 0
    arm: 'both'
