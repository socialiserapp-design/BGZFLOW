schema_version: "1.1"
name: trigger-eff-swarm-cost
description: 'Should make bg-efficiency fire.'
tags: [trigger, trigger-should-fire]
expected_outcome: 'bg-efficiency is invoked.'
execution:
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Our lead chats keep re-reading huge logs and everything runs at max effort. Make the worker setup cheaper to run.
graders:
  - name: fires
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?bg-efficiency"'
