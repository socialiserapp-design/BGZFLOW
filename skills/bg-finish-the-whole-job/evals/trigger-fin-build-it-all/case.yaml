schema_version: "1.1"
name: trigger-fin-build-it-all
description: 'Should make bg-finish-the-whole-job fire.'
tags: [trigger, trigger-should-fire]
expected_outcome: 'bg-finish-the-whole-job is invoked.'
execution:
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    The plan's agreed. Build the whole thing and make all the pieces work together.
graders:
  - name: fires
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?bg-finish-the-whole-job"'
