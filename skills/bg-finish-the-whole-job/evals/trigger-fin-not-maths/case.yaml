schema_version: "1.1"
name: trigger-fin-not-maths
description: 'Must not make bg-finish-the-whole-job fire.'
tags: [trigger, trigger-should-not-fire]
expected_outcome: 'bg-finish-the-whole-job is not invoked.'
execution:
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    What is 17 times 23?
graders:
  - name: stays-quiet
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?bg-finish-the-whole-job"'
    min: 0
    max: 0
    arm: 'both'
