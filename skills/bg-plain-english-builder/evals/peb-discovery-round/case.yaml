schema_version: "1.1"
name: peb-discovery-round
description: 'An underspecified idea starts with useful open-ended discovery instead of a leading menu or premature implementation.'
tags: [quality]
expected_outcome: 'A targeted open-ended question about the intended outcome; existing facts investigated; no fabricated preference or premature build.'
execution:
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    I want an app where neighbours can lend each other tools.
graders:
  - name: no-code-yet
    type: regex
    target: 'last_message'
    pattern: '```(?:tsx?|jsx?|swift|kotlin|dart)'
    match: 'not_contains'
  - name: question-round
    type: llm
    criteria: |
      PASS if the reply elicits the intended outcome in the user's own words without assuming how the lending service should work. It can explain why the question matters, but must not prescribe a revenue model, deposits or a compulsory prototype before the user's intent is understood.
      FAIL if it starts building from guessed product choices, substitutes a leading menu for unknown intent, or demands a preset question count. Open-ended questions are valid and expected here.
  - name: skill-fired
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?bg-plain-english-builder"'
    arm: 'with-only'
