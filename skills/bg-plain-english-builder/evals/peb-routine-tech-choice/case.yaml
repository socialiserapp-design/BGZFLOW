schema_version: "1.1"
name: peb-routine-tech-choice
description: 'A routine technical choice is made by the agent, not handed to the founder.'
tags: [quality, efficiency]
expected_outcome: 'Picks a database with a short reason.'
execution:
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    For the tool-lending app, should we use Postgres or MongoDB?
graders:
  - name: decides
    type: llm
    criteria: |
      PASS if the reply picks one option with a short reason and treats it as a technical choice the team makes.
      FAIL if it hands the decision back to the founder without picking, or writes a long comparison with no choice.
  - name: skill-fired
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?bg-plain-english-builder"'
    arm: 'with-only'
