schema_version: "1.1"
name: des-mobile-settings-screen
description: 'A mobile settings screen gets native craft (platform patterns, states, haptics, accessibility) in a look chosen for that product.'
tags: [quality, craft]
expected_outcome: 'Platform-correct settings (grouped rows, native switches, safe areas, scalable text, 44pt/48dp targets), every toggle state covered (saving, failed, unknown), optional success haptics only after a confirmed change, supported theme modes and accessibility preferences, with relevant existing design or an informed visual choice.'
execution:
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Design the settings screen for our iPhone and Android habit-tracker app: notifications, reminder time, theme, account and delete account. It should feel really polished.
graders:
  - name: native-craft
    type: llm
    criteria: |
      PASS if it uses platform-correct patterns on both platforms (grouped list rows, native switches and pickers, safe areas, large-title or top app bar conventions), scalable text, touch targets of at least 44pt on iOS and 48dp on Android, saving/failed/unknown states for toggles, success haptics only after a confirmed change if haptics are used, the supported theme modes, reduced-motion handling where motion is used and screen-reader labels, and a clear destructive-action treatment for delete account.
      FAIL if it ignores relevant platform differences or saving/failed/unknown states, fires success feedback before confirmation, or adds an unrequested theme or motion feature to meet a checklist. Native custom styling is acceptable when accessible and appropriate.
  - name: look-is-chosen
    type: llm
    criteria: |
      PASS if the visual look comes from the product's approved look or, when none exists, from a proportionate comparison (for example native-pure versus soft tactile) that resolves the actual open choice, with no single house style imposed.
      FAIL if it applies one fixed look (for example dark glass) as the default without offering options.
  - name: skill-fired
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?bg-personal-product-design"'
    arm: 'with-only'
