schema_version: "1.1"
name: des-two-products-two-looks
description: 'A request for cross-product consistency is respected while audience-specific usability is considered.'
tags: [quality, range]
expected_outcome: 'Clarify which shared identity the user wants, recommend adaptations for legal work, and preserve the requested continuity rather than imposing either identical styling or forced novelty.'
execution:
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    We just finished the look for our reading app for children (rounded, bright, bouncy). Now design the main screen for our new legal-billing tool for law firms. Reuse whatever worked last time so the products feel consistent.
graders:
  - name: distinct-looks
    type: llm
    criteria: |
      PASS if it recognises the explicit request for consistency, inspects reusable brand decisions and asks the smallest consequential question about what should carry over when that is unclear. It explains how readable data, error prevention and restrained repeated motion may help legal billing, with concrete costs and benefits. It may retain shared colours, fonts or shapes while adapting density and behaviour to the task.
      FAIL if it ignores the user's consistency request, insists every product must look different, silently copies unsuitable interaction behaviour, or treats its recommendation as permission to replace the shared identity.
  - name: skill-fired
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?bg-personal-product-design"'
    arm: 'with-only'
