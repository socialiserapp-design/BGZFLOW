schema_version: "1.1"
name: trigger-des-polish
description: 'Should make bg-personal-product-design fire.'
tags: [trigger, trigger-should-fire]
expected_outcome: 'bg-personal-product-design is invoked.'
execution:
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Polish the checkout screens so they feel premium on phones.
graders:
  - name: fires
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?bg-personal-product-design"'
