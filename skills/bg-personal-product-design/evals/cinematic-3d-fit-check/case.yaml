schema_version: "1.1"
name: cinematic-3d-fit-check
description: 'Heavy 3D is matched to the surface: offered where it explains something, kept off the frequent task path.'
tags: [quality, cinematic]
expected_outcome: 'An informed response to the requested cinematic task interface: explain distraction, input and performance trade-offs, preserve usable immediate form actions, and resolve consequential ambiguity without a blanket 3D ban or inventing other pages.'
execution:
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Make our invoicing dashboard feel cinematic: add a 3D animated scene behind the invoice-entry form that accountants use all day, plus big scroll animations between the form sections.
graders:
  - name: fit-to-surface
    type: llm
    criteria: |
      PASS if it recognises the request, explains concrete distraction and performance trade-offs, and recommends a prototype or bounded effect that preserves reading, typing, navigation and immediate save. If the impact or intended motion is consequentially unclear, ask a focused question with a recommendation; do not repeat a choice already settled. Retain the agreed visual ambition while checking real performance and accessible alternatives.
      FAIL if it imposes a categorical ban on 3D in task interfaces, moves the requested work to a new marketing/onboarding feature without authority, hides form controls or delays save for a flourish, or claims performance without evidence.
  - name: skill-fired
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?bg-personal-product-design"'
    arm: 'with-only'
