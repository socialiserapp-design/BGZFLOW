schema_version: "1.1"
name: cinematic-native-app-motion
description: 'An app screen gets polished, platform-true native motion with guardrails and fallbacks.'
tags: [quality, cinematic]
expected_outcome: 'Platform-true motion on the UI thread with useful transitions, interruptible gestures, accessible alternatives and relevant device evidence; no fixed frequency gate, animation recipe or requirement to add haptics.'
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Our Expo app (iOS and Android) has a recipe list that opens a recipe detail with a Save button. The approved look is already locked. Make the motion on these screens feel polished and premium, like a top native app. What exactly should the builder do?
graders:
  - name: native-craft
    type: llm
    criteria: |
      PASS if the plan gives concrete native motion craft, including most of: platform components first (native stack or sheet transitions); a shared-element or measured carrier from the list item into the detail header; press feedback using the product's press-scale token (or a highlight for list rows); springs or ease-out curves with named duration or damping values; a collapsing header by translate and fade with clamped interpolation rather than animating height; motion running on the UI thread (for example Reanimated shared values or worklets) with no per-frame React state; unobtrusive repeated interactions with no artificial wait; optional success haptics only after confirmed persistence.
      It must keep the locked look and task responsiveness. Pointer decoration is inappropriate to a touch-only flow; do not add a web scroll library or unrequested ambient loop as a substitute for native interaction design.
      FAIL if it is generic, web-centric, or delays the Save action for an animation.
  - name: guardrails-and-fallbacks
    type: llm
    criteria: |
      PASS if it includes at least three of: a reduced-motion variant that keeps clear state information through instant changes or suitable restrained transitions; a reduced-transparency or opaque fallback for any blur or glass; interruptible gestures that continue from the current position, with velocity-or-distance commit; decorative effects paused off-screen or in the background; a weaker-device tier or static fallback for any shader or blur effect, avoiding animated blur on Android; relevant release-build checks on representative available iOS and Android hardware for claimed performance, with emulator and Expo Go evidence labelled accurately and unavailable coverage left explicit.
      FAIL if it gives no fallbacks or claims performance without device evidence.
  - name: read-platform-reference
    type: tool_used
    tool: 'Read'
    input_match: 'motion-by-platform'
    arm: 'with-only'
  - name: skill-fired
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?bg-personal-product-design"'
    arm: 'with-only'
