schema_version: "1.1"
name: trigger-des-not-summary
description: 'Must not make bg-personal-product-design fire.'
tags: [trigger, trigger-should-not-fire]
expected_outcome: 'bg-personal-product-design is not invoked.'
execution:
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Summarise the plot of Hamlet in two lines.
graders:
  - name: stays-quiet
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?bg-personal-product-design"'
    min: 0
    max: 0
    arm: 'both'
