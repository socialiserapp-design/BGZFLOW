schema_version: "1.1"
name: trigger-cont-not-explain
description: 'Must not make bg-continue-my-project fire.'
tags: [trigger, trigger-should-not-fire]
expected_outcome: 'bg-continue-my-project is not invoked.'
execution:
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Explain recursion in two sentences.
graders:
  - name: stays-quiet
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?bg-continue-my-project"'
    min: 0
    max: 0
    arm: 'both'
