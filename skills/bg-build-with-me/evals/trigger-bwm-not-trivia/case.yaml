schema_version: "1.1"
name: trigger-bwm-not-trivia
description: 'Must not make bg-build-with-me fire.'
tags: [trigger, trigger-should-not-fire]
expected_outcome: 'bg-build-with-me is not invoked.'
execution:
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    What does HTTP status 409 mean?
graders:
  - name: stays-quiet
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?bg-build-with-me"'
    min: 0
    max: 0
    arm: 'both'
