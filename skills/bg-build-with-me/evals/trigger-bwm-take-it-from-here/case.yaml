schema_version: "1.1"
name: trigger-bwm-take-it-from-here
description: 'Should make bg-build-with-me fire.'
tags: [trigger, trigger-should-fire]
expected_outcome: 'bg-build-with-me is invoked.'
execution:
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Take this from here and get the whole onboarding revamp done. Pick whatever stages and workers it needs.
graders:
  - name: fires
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?bg-build-with-me"'
