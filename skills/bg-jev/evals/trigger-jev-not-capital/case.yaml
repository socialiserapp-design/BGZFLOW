schema_version: "1.1"
name: trigger-jev-not-capital
description: 'Must not make bg-jev fire.'
tags: [trigger, trigger-should-not-fire]
expected_outcome: 'bg-jev is not invoked.'
execution:
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    What is the capital of Australia?
graders:
  - name: stays-quiet
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?bg-jev"'
    min: 0
    max: 0
    arm: 'both'