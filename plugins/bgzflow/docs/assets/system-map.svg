<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
<title id="title">BGZFLOW: from intent to evidence</title><desc id="desc">Discover and clarify, build a usable slice, assess real quality, then deliver and observe. Failed outcomes return to the builder. Deterministic checks and host permissions support the process.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111c32"/><stop offset="1" stop-color="#08121d"/></linearGradient><linearGradient id="accent"><stop stop-color="#6fe7cf"/><stop offset="1" stop-color="#8caeff"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#80dccd"/></marker></defs>
<rect width="1200" height="450" rx="28" fill="url(#bg)"/><g font-family="system-ui,sans-serif"><text x="48" y="55" fill="#7de6ce" font-size="15" letter-spacing="4">BGZFLOW / THE OUTCOME LOOP</text><text x="48" y="103" fill="#f3f7ff" font-size="31" font-weight="700">Build the right thing. Prove the real result.</text>
<g fill="#15253b" stroke="#3b506c"><rect x="48" y="153" width="237" height="122" rx="18"/><rect x="337" y="153" width="237" height="122" rx="18"/><rect x="626" y="153" width="237" height="122" rx="18"/><rect x="915" y="153" width="237" height="122" rx="18"/></g>
<g fill="#9eb5d1" font-size="13"><text x="69" y="180">01 / INTENT</text><text x="358" y="180">02 / EXECUTION</text><text x="647" y="180">03 / EVIDENCE</text><text x="936" y="180">04 / REAL USE</text></g><g fill="#f3f7ff" font-size="21" font-weight="600"><text x="69" y="214">Discover &amp; clarify</text><text x="358" y="214">Build a usable slice</text><text x="647" y="214">Assess real quality</text><text x="936" y="214">Deliver &amp; observe</text></g><g fill="#b7c7da" font-size="14"><text x="69" y="247">Purpose · gaps · benchmarks</text><text x="358" y="247">Relevant methods · ownership</text><text x="647" y="247">Actual outcome · honest limits</text><text x="936" y="247">Same candidate · real effects</text></g>
